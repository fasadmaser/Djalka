<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#174d3b"><title>Каталог магазина — Джалка</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f1;color:#193b30;font:16px system-ui,sans-serif}header{background:#174d3b;color:white;padding:22px 16px}header a{color:#dceee4;font-size:14px}h1{margin:10px 0 5px;font-size:28px}main{max-width:900px;margin:auto;padding:16px 12px 100px}button,input{font:inherit;color:inherit;border:1px solid #cdd8ce;border-radius:12px;padding:12px;background:white}button{cursor:pointer;font-weight:650}button:disabled{opacity:.5}.primary{background:#174d3b;color:white;border:0}input{width:100%}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:16px 0}.product{background:white;border:1px solid #dfe5db;border-radius:15px;padding:10px;overflow-wrap:anywhere}.photo{height:120px;background:#edf1e8;border-radius:10px;display:grid;place-items:center;font-size:42px}.photo img{width:100%;height:120px;object-fit:contain}.product button{width:100%}.product h3{font-size:16px;margin:10px 0 4px}.price{font-size:20px;font-weight:750;margin:8px 0}small,#status{color:#69796e}footer{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;padding:10px 12px max(10px,env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center}dialog{width:min(94vw,520px);border:0;border-radius:16px;padding:20px;max-height:85vh;overflow:auto;color:inherit}dialog::backdrop{background:#0007}.line{border-bottom:1px solid #ddd;padding:10px 0}.line button{padding:6px 12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}#more{width:100%}a{color:#176748}@media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
#ad{max-width:42%;width:180px;background:#f5e7bb;color:#193b30;border-radius:14px;padding:10px;overflow-wrap:anywhere}#ad img{width:100%;max-height:140px;object-fit:contain;border-radius:8px}#ad:empty{display:none}header .headrow{display:flex;gap:12px;align-items:center;justify-content:space-between}#productDialog img{width:100%;max-height:60vh;object-fit:contain;background:#f4f5f1;border-radius:12px}#productDialog p{white-space:pre-wrap;overflow-wrap:anywhere}#productDialog .primary{width:100%}.detailOpen{cursor:pointer}#cat{width:100%;padding:10px;margin-top:8px;font:inherit;border-radius:12px;border:1px solid #cdd8ce;background:white} </style></head><body><header><a href="./">‹ Все магазины Джалки</a><div class="headrow"><div><h1 id="name">Каталог магазина</h1><div id="details"></div></div><div id="ad"></div></div></header><main><input id="search" type="search" placeholder="Название или номер товара" aria-label="Поиск товара"><select id="cat" aria-label="Категория"><option value="">Все категории</option></select><p id="status" role="status">Загрузка…</p><div id="grid" class="grid"></div><button id="more" hidden>Показать ещё 30</button></main><footer><button id="share">Поделиться</button><button class="primary" id="basket">Корзина (0)</button></footer><dialog id="dialog"><h2>Корзина</h2><div id="lines"></div><p id="total"></p><div class="row"><button id="copy">Копировать список</button><button class="primary" id="send">WhatsApp</button><button id="close">Закрыть</button></div></dialog><dialog id="productDialog"></dialog><script src="config.js"></script><script>
'use strict';const $=x=>document.getElementById(x),shop=new URLSearchParams(location.search).get('shop'),cfg=globalThis.DJALKA_CONFIG,fmt=n=>Number(n).toLocaleString('ru-RU')+' ₽';let b=null,offset=0,generation=0,loading=false,timer,cart={};const key='djalka-catalog-cart-'+shop;try{cart=JSON.parse(localStorage.getItem(key))||{}}catch{};const put=()=>{try{localStorage.setItem(key,JSON.stringify(cart))}catch{}$('basket').textContent='Корзина ('+Object.values(cart).reduce((n,p)=>n+p.qty,0)+')'};put();
async function api(table,params){const r=await fetch(cfg.url+'/rest/v1/'+table+'?'+new URLSearchParams(params),{headers:{apikey:cfg.key},signal:AbortSignal.timeout?AbortSignal.timeout(25000):undefined});if(!r.ok)throw Error('Сервер: '+r.status);return r.json()}

const statsSent=new Set();
function trackCatalog(business,product,event){
 if(!cfg||!navigator.onLine||!business||business==='demo-shop')return;
 let visitor;try{visitor=localStorage.getItem('djalka-stats-visitor');if(!visitor){visitor=crypto.randomUUID();localStorage.setItem('djalka-stats-visitor',visitor)}}catch{return}
 const k=[new Date().toISOString().slice(0,10),business,product,event].join('|');if(statsSent.has(k))return;statsSent.add(k);
 fetch(cfg.url+'/rest/v1/rpc/track_catalog',{method:'POST',headers:{apikey:cfg.key,'Content-Type':'application/json'},body:JSON.stringify({p_business:business,p_product:product,p_event:event,p_visitor:visitor}),keepalive:true}).then(r=>{if(!r.ok)statsSent.delete(k)}).catch(()=>statsSent.delete(k));
}

const node=(tag,txt,cls)=>{let e=document.createElement(tag);if(txt!==undefined)e.textContent=txt;if(cls)e.className=cls;return e};const photos=new IntersectionObserver(entries=>{for(const en of entries)if(en.isIntersecting){photos.unobserve(en.target);loadPhoto(en.target)}} ,{rootMargin:'100px'});
async function loadPhoto(el){try{let k=new URL('./catalog.html?photo='+encodeURIComponent(el.dataset.id),location.href),v;try{let c=await caches.open('djalka-catalog-photos');let hit=await c.match(k);if(hit){let j=await hit.json();if(Date.now()-j.time<86400000)v=j.photo}}catch{}if(v===undefined){let a=await api('products',{business_id:'eq.'+shop,id:'eq.'+el.dataset.id,select:'photo'});v=a[0]?.photo||'';try{let c=await caches.open('djalka-catalog-photos');let keys=await c.keys();if(keys.length>=300)await c.delete(keys[0]);await c.put(k,new Response(JSON.stringify({time:Date.now(),photo:v})))}catch{}}if(/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(v)){let i=node('img');i.alt='';i.src=v;el.replaceChildren(i)}}catch{}}
const article=p=>p.article==null?'':String(p.article).padStart(4,'0');
function card(p){let e=node('article',undefined,'product'),ph=node('div',p.emoji||'📦','photo');ph.dataset.id=p.id;photos.observe(ph);let add=node('button','+ В корзину','primary');add.disabled=!p.available;add.onclick=()=>{trackCatalog(shop,p.id,'cart');cart[p.id]={...p,qty:(cart[p.id]?.qty||0)+1};put();add.textContent='В корзине: '+cart[p.id].qty+' · +'};if(cart[p.id])add.textContent='В корзине: '+cart[p.id].qty+' · +';let title=node('h3',p.name,'detailOpen');ph.classList.add('detailOpen');ph.onclick=title.onclick=()=>openProduct(p.id);title.tabIndex=0;title.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')openProduct(p.id)};e.append(ph,node('small','№ '+article(p)),title,node('small',p.available?'В наличии':'Нет в наличии'),node('div',fmt(p.price)+' / '+(p.unit||'шт.'),'price'),add);return e}
async function load(reset=false){if(!b)return;if(reset){generation++;offset=0;loading=false;photos.disconnect();$('grid').replaceChildren()}if(loading)return;let g=generation;loading=true;$('more').hidden=true;$('status').textContent='Загрузка…';try{let q=$('search').value.trim(),params={business_id:'eq.'+shop,select:'id,name,price,unit,category,emoji,available,article',order:'name.asc,id.asc',limit:'31',offset:String(offset)};if($('cat').value)params.category='eq.'+$('cat').value;if(/^\d+$/.test(q))params.article='eq.'+Number(q);else if(q)params.name='ilike.*'+q.replace(/[*,%_\\]/g,'')+'*';let rows=await api('products',params);if(g!==generation)return;let visible=rows.slice(0,30);for(let p of visible)$('grid').append(card(p));offset+=visible.length;$('status').textContent=offset?'Показано товаров: '+offset:'Товары не найдены';$('more').hidden=rows.length<=30}catch(e){if(g===generation){$('status').textContent='Не удалось загрузить каталог. Проверьте интернет.';$('more').textContent='Повторить';$('more').hidden=false}}finally{if(g===generation)loading=false}}
$('more').onclick=()=>{$('more').textContent='Показать ещё 30';load()};$('cat').onchange=()=>load(true);$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>load(true),350)};
function lines(){let box=$('lines');box.replaceChildren();let sum=0;for(let p of Object.values(cart)){sum+=p.price*p.qty;let line=node('div',undefined,'line'),r=node('div',undefined,'row'),minus=node('button','−'),plus=node('button','+');minus.onclick=()=>{if(--p.qty<=0)delete cart[p.id];put();lines()};plus.onclick=()=>{p.qty++;put();lines()};r.append(minus,node('span',String(p.qty)),plus,node('strong',fmt(p.price*p.qty)));line.append(node('div','№ '+article(p)+' · '+p.name+' · '+fmt(p.price)),r);box.append(line)}$('total').textContent='Итого: '+fmt(sum);$('send').disabled=!Object.keys(cart).length||!b;$('copy').disabled=!Object.keys(cart).length}
function text(){return 'Заказ • '+(b?.name||'Джалка')+'\n'+Object.values(cart).map(p=>(article(p)?'№ '+article(p)+' · ':'')+p.name+' — '+p.qty+' '+(p.unit||'шт.')+' × '+fmt(p.price)).join('\n')+'\nИтого: '+fmt(Object.values(cart).reduce((s,p)=>s+p.price*p.qty,0))+'\nЦены и наличие уточняются у продавца.'}
$('basket').onclick=()=>{lines();$('dialog').showModal()};$('close').onclick=()=>$('dialog').close();async function copy(t){try{await navigator.clipboard.writeText(t);alert('Скопировано')}catch{prompt('Скопируйте текст',t)}}$('copy').onclick=()=>copy(text());$('share').onclick=()=>navigator.share?navigator.share({title:b?.name||'Джалка',url:location.href}).catch(()=>{}):copy(location.href);$('send').onclick=()=>{let p=String(b?.phone||'').replace(/\D/g,'');if(p.length===11&&p[0]==='8')p='7'+p.slice(1);if(p.length===10)p='7'+p;if(!/^[1-9]\d{9,14}$/.test(p)){alert('Телефон магазина не указан. Скопируйте список.');return}trackCatalog(shop,'','whatsapp');location.href='https://wa.me/'+p+'?text='+encodeURIComponent(text())};

function validPhoto(v){return /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(v||'')}
function showAd(){let el=$('ad');if(validPhoto(b.ad_photo)){let im=node('img');im.src=b.ad_photo;im.alt='';el.append(im)}if(b.ad_text)el.append(node('div',b.ad_text));if(b.ad_product_id&&el.childNodes.length){el.tabIndex=0;el.style.cursor='pointer';el.onclick=()=>openProduct(b.ad_product_id);el.onkeydown=e=>{if(e.key==='Enter')openProduct(b.ad_product_id)}}}
async function loadCategories(){try{let cats=new Set;for(let o=0;;o+=500){let r=await api('products',{business_id:'eq.'+shop,select:'category',order:'id.asc',limit:'500',offset:String(o)});r.forEach(p=>{if(p.category)cats.add(p.category)});if(r.length<500)break}for(let v of [...cats].sort()){let opt=node('option',v);opt.value=v;$('cat').append(opt)}}catch{}}
let detailGeneration=0;
async function openProduct(id){let d=$('productDialog'),g=++detailGeneration;d.replaceChildren();let close=node('button','‹ Назад');close.onclick=()=>{detailGeneration++;d.close()};d.append(close,node('p','Загрузка товара…'));if(!d.open)d.showModal();try{let p=(await api('products',{business_id:'eq.'+shop,id:'eq.'+id,select:'id,name,price,unit,category,emoji,available,article,photo,gallery,detail_text,specifications'}))[0];if(g!==detailGeneration||!d.open)return;if(!p)throw Error('Товар не найден');trackCatalog(shop,p.id,'product_view');let images=(Array.isArray(p.gallery)?p.gallery:[]).filter(validPhoto);if(!images.length&&validPhoto(p.photo))images=[p.photo];d.replaceChildren(close);if(images.length){let im=node('img'),n=0,prev=node('button','‹'),next=node('button','›'),count=node('span'),r=node('div',undefined,'row');function show(){im.src=images[n];count.textContent=(n+1)+' / '+images.length}im.alt=p.name;im.onclick=()=>{if(im.requestFullscreen)im.requestFullscreen().catch(()=>{});else if(im.webkitRequestFullscreen)im.webkitRequestFullscreen()};prev.onclick=()=>{n=(n+images.length-1)%images.length;show()};next.onclick=()=>{n=(n+1)%images.length;show()};r.append(prev,count,next);d.append(im);if(images.length>1)d.append(r);show()}d.append(node('small','№ '+article(p)),node('h2',p.name),node('h2',fmt(p.price)+' / '+(p.unit||'шт.')),node('p',p.available?'В наличии':'Нет в наличии'));if(p.detail_text)d.append(node('h3','Описание'),node('p',p.detail_text));if(p.specifications)d.append(node('h3','Характеристики'),node('p',p.specifications));let add=node('button','В корзину','primary');add.disabled=!p.available;add.onclick=()=>{trackCatalog(shop,p.id,'cart');let {gallery,photo,detail_text,specifications,...item}=p;cart[p.id]={...item,qty:(cart[p.id]?.qty||0)+1};put();add.textContent='В корзине: '+cart[p.id].qty+' · +'};d.append(add)}catch(e){if(g===detailGeneration&&d.open)d.replaceChildren(close,node('p','Не удалось загрузить товар. Попробуйте снова.'))}}

(async()=>{if(!/^[a-zA-Z0-9_-]+$/.test(shop||'')||!cfg){$('status').textContent='Откройте каталог из карточки магазина.';return}try{b=(await api('businesses',{id:'eq.'+shop,select:'id,name,address,hours,phone,description,ad_text,ad_photo,ad_product_id'}))[0];if(!b){$('status').textContent='Магазин не найден.';return}trackCatalog(shop,'','shop_view');$('name').textContent=b.name;let phone=String(b.phone||'').replace(/[^+\d]/g,'');if(phone){let call=node('a','Позвонить');call.href='tel:'+phone;call.onclick=()=>trackCatalog(shop,'','call');$('details').after(call);}document.title=b.name+' — Джалка';$('details').textContent=[b.address,b.hours,b.description].filter(Boolean).join(' · ');showAd();load(true);loadCategories()}catch{$('status').textContent='Не удалось открыть магазин. Проверьте интернет и обновите страницу.'}})();
</script></body></html>
